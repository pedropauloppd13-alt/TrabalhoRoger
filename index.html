<script>
    $("html").on("keydown", (e) => {
        let aux = e.key;
        if (aux.length > 1) {
            return
        }
        if (!/^[a-zA-Z]$/.test(event.key)) {
            return;
        }
        $("#letra").html(aux)
        let letra = new SpeechSynthesisUtterance(aux)
        letra.lang = "pt-BR"; // idioma português
        letra.rate = 0.9; // velocidade da fala (1 = normal)
        letra.pitch = 1; // tom da voz
        letra.volume = 1;
        console.log(speechSynthesis.getVoices())

        speechSynthesis.cancel(); // interrompe fala anterior, se houver
        speechSynthesis.speak(letra);
        //o speach synthesis não funciona no meu pc, mas o chat falow q o código tá 
        //certo, como eu tô com preguiça de resolver, espero q funcione.
        if (["a", "e", "i", "o", "u", "y", "d", "A", "E", "I", "O", "U", "Y", "D"].includes(aux)) {
            mostraVogal(aux)
        } else {
            mostraVogal("limpar")
        }
    })

    function mostraVogal(letra) {
        if (letra === "limpar") {
            $("#ilustracao").attr("src", "")
        } else {
            $("#ilustracao").attr("src", "imgs/" + letra + "-img.png")
        }
    }
